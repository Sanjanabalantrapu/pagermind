# Local stack: Hindsight (memory) + PagerMind (agent + console).
#   cp .env.example .env   # add GROQ_API_KEY
#   docker compose up --build
# Hindsight API  -> http://localhost:8888   Hindsight control plane UI -> http://localhost:9999
# PagerMind UI   -> http://localhost:8000
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    shm_size: 1g
    ports: ["8888:8888", "9999:9999"]
    environment:
      HINDSIGHT_API_LLM_PROVIDER: groq
      HINDSIGHT_API_LLM_API_KEY: ${GROQ_API_KEY}
      HINDSIGHT_API_WORKER_ID: pagermind-local
    volumes: ["hindsight-data:/home/hindsight/.pg0"]
    restart: unless-stopped

  pagermind:
    build: .
    depends_on: [hindsight]
    env_file: .env
    environment:
      HINDSIGHT_URL: http://hindsight:8888
    ports: ["8000:8000"]

volumes:
  hindsight-data:
