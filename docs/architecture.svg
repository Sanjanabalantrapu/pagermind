<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">PagerMind architecture</text>

  <!-- alert -->
  <rect x="30" y="90" width="190" height="80" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="125" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Alert fires</text>
  <text x="125" y="146" text-anchor="middle" font-size="12" fill="#7f1d1d">service, severity, log lines</text>

  <!-- agent -->
  <rect x="300" y="70" width="400" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">IncidentAgent (FastAPI)</text>
  <rect x="320" y="115" width="170" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="405" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">1. gather_context</text>
  <text x="405" y="163" text-anchor="middle" font-size="11" fill="#334155">4 tag-scoped recalls</text>
  <rect x="510" y="115" width="170" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="595" y="143" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">2. LLM + tools</text>
  <text x="595" y="163" text-anchor="middle" font-size="11" fill="#334155">search / ask memory</text>
  <rect x="320" y="200" width="170" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="405" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">3. retain triage</text>
  <text x="405" y="248" text-anchor="middle" font-size="11" fill="#334155">experience memory</text>
  <rect x="510" y="200" width="170" height="70" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="595" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">4. record_feedback</text>
  <text x="595" y="248" text-anchor="middle" font-size="11" fill="#334155">WORKED / DID NOT WORK</text>

  <!-- llm -->
  <rect x="780" y="90" width="190" height="80" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="875" y="123" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Groq LLM</text>
  <text x="875" y="146" text-anchor="middle" font-size="12" fill="#4c1d95">gpt-oss-120b → qwen3-32b</text>

  <!-- engineer -->
  <rect x="780" y="210" width="190" height="80" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="875" y="243" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">On-call engineer</text>
  <text x="875" y="266" text-anchor="middle" font-size="12" fill="#14532d">console at :8000</text>

  <!-- hindsight -->
  <rect x="200" y="360" width="600" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="390" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Hindsight memory bank: pagermind-&lt;team&gt;</text>
  <rect x="220" y="405" width="175" height="75" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="307" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">World facts</text>
  <text x="307" y="452" text-anchor="middle" font-size="11" fill="#334155">postmortems, runbooks,</text>
  <text x="307" y="468" text-anchor="middle" font-size="11" fill="#334155">owners, policies</text>
  <rect x="412" y="405" width="175" height="75" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="500" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Experience</text>
  <text x="500" y="452" text-anchor="middle" font-size="11" fill="#334155">what PagerMind advised,</text>
  <text x="500" y="468" text-anchor="middle" font-size="11" fill="#334155">what engineers said worked</text>
  <rect x="605" y="405" width="175" height="75" rx="8" fill="#fff" stroke="#fcd34d"/>
  <text x="692" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Observations</text>
  <text x="692" y="452" text-anchor="middle" font-size="11" fill="#334155">auto-consolidated patterns,</text>
  <text x="692" y="468" text-anchor="middle" font-size="11" fill="#334155">e.g. "3rd pgbouncer outage"</text>
  <text x="500" y="512" text-anchor="middle" font-size="11" fill="#92400e">tags: service:* · kind:* · severity:*   |   recall = semantic + BM25 + graph + temporal</text>

  <!-- arrows -->
  <line x1="220" y1="130" x2="298" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="700" y1="130" x2="778" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="778" y1="250" x2="702" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="405" y1="290" x2="405" y2="358" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <text x="395" y="330" text-anchor="end" font-size="12" font-weight="700" fill="#b45309">recall() / retain()</text>
  <line x1="595" y1="290" x2="595" y2="358" stroke="#b45309" stroke-width="2" marker-end="url(#a)"/>
  <text x="605" y="330" font-size="12" font-weight="700" fill="#b45309">retain() · reflect()</text>
</svg>
